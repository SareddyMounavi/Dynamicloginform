<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="bootstrap.css">
    <link rel="stylesheet" href="mdb.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body>
    <div>
        <button class="btn btn-secondary" data-toggle="modal" data-target="#abc">Register</button>
        <div class="modal "id="abc">
            <div class="modal-dialog">
                <div class="modal-content animated swing">
                    <div class="modal-header bg-secondary">
                        <h3>Register Here</h3>
                        <button class="close" data-dismiss="modal">
                            <i class="bi bi-x-lg"></i>
                        </button>
                    </div>
                    <div class="modal-body bg-warning">
                        <form action="https://api.web3forms.com/submit" method="POST">
                            <!-- Replace with your Access Key -->
                            <input type="hidden" name="access_key" value="dfeb43e6-0ef9-4d36-b060-d8fea3edb26a">
                            <div class="form-group">
                                <input type="text" name="name" class="form-control" placeholder="UserName">
                            </div>
                            <div class="form-group">
                                <input type="text" name="email" class="form-control" placeholder="Enter Email">
                            </div>
                            <div class="form-group">
                                <textarea rows="5" name="message" class="form-control" placeholder="About Yourself"></textarea>
                            </div>
                            <button class="btn btn-primary">Submit</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="jquery.js"></script>
    <script src="popper.js"></script>
    <script src="bootstrap.js"></script>
    <script src="mdb.js"></script>
</body>
</html>
